name: AITRAPP CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio

      - name: Lint with ruff
        run: |
          ruff check . || echo "⚠️ Ruff found issues (not failing build yet)"

      - name: Type check with mypy (optional)
        run: |
          mypy packages/ --ignore-missing-imports || echo "⚠️ Mypy warnings (not failing build yet)"

      - name: Unit tests
        run: |
          pytest tests/ -v --tb=short || echo "⚠️ Some tests failed"

      - name: Smoke backtest (quick validation)
        run: |
          # Quick smoke test: 1 week of data, single strategy
          python scripts/run_backtest.py \
            --symbol NIFTY \
            --start-date 2025-11-01 \
            --end-date 2025-11-07 \
            --strategy ORB \
            --capital 1000000 \
            --data-dir "docs/NSE OPINONS DATA" || echo "⚠️ Smoke backtest failed (may need data files)"

      - name: Check for sensitive files
        run: |
          # Ensure no .env files are committed
          if git ls-files | grep -E '\.env$|\.env\.bak$|\.env\..*\.bak$'; then
            echo "❌ ERROR: Sensitive .env files detected in repository!"
            exit 1
          fi
          echo "✅ No sensitive files found"

