name: Compliance Log Archive

on:
  schedule:
    - cron: "0 18 * * *"  # 11:30 PM IST daily (18:00 UTC)
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARCHIVE_BUCKET: ${{ secrets.ARCHIVE_BUCKET }}
  ARCHIVE_PREFIX: "algo-logs"

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: env.ARCHIVE_BUCKET != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install awscli
        run: |
          python -m pip install --upgrade pip
          pip install awscli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Package logs and reports
        run: |
          ts=$(date -u +"%Y%m%dT%H%M%SZ")
          pkg="archive_${ts}.tar.gz"
          mkdir -p /tmp/archive
          # Collect known report/log dirs; skip if absent
          rsync -a --prune-empty-dirs \
            logs/ reports/ results/ \
            /tmp/archive/ 2>/dev/null || true
          if [ -z "$(ls -A /tmp/archive 2>/dev/null)" ]; then
            echo "No logs/reports to archive; exiting."
            exit 0
          fi
          tar -czf "$pkg" -C /tmp/archive .
          echo "PKG=$pkg" >> $GITHUB_ENV

      - name: Upload to S3
        if: env.PKG != ''
        run: |
          dest="s3://${ARCHIVE_BUCKET}/${ARCHIVE_PREFIX}/$PKG"
          aws s3 cp "$PKG" "$dest"
          echo "Uploaded $PKG to $dest"
