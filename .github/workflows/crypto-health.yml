name: crypto-health

on:
  schedule:
    - cron: "*/30 * * * *"  # Every 30 minutes
  workflow_dispatch:

concurrency:
  group: crypto-health
  cancel-in-progress: true

jobs:
  crypto-health-check:
    timeout-minutes: 10
    runs-on: self-hosted
    labels: [paper-runner]
    
    env:
      DATABASE_URL: postgresql+psycopg2://trader:trader@localhost:5432/aitrapp
      REDIS_URL: redis://localhost:6379/0
      APP_MODE: CRYPTO_PAPER
      APP_TIMEZONE: UTC
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose up -d postgres redis
          for i in {1..30}; do
            docker compose exec -T postgres pg_isready -U trader -d aitrapp && \
            docker compose exec -T redis redis-cli ping && break || sleep 2
          done

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DB migrate
        run: alembic upgrade head

      - name: Copy crypto config
        run: cp configs/crypto_paper.yaml configs/app.yaml

      - name: Boot API (CRYPTO_PAPER) in background
        run: nohup uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 & echo $! > api.pid

      - name: Wait for /health
        run: |
          for i in {1..30}; do curl -fsS http://localhost:8000/health && break || sleep 2; done

      - name: Run crypto scorer
        run: scripts/score_crypto_day1.sh || (echo "::error ::crypto scorer failed" && exit 1)

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          curl -s http://localhost:8000/metrics > artifacts/metrics.txt || true
          cp -R reports/burnin artifacts/ || true
          # Generate crypto report if scorer JSONs exist
          if ls reports/burnin/crypto_day1_*.json 1> /dev/null 2>&1; then
            bash scripts/crypto_report.sh || true
            cp -R reports/crypto artifacts/ || true
          fi
        shell: bash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypto-health-${{ github.run_id }}
          path: artifacts
          retention-days: 30

      - name: Stop API
        if: always()
        run: kill -9 $(cat api.pid) || true

