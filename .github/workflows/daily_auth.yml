name: Daily Auth Check

on:
  schedule:
    # 8:00 AM IST is 2:30 AM UTC
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  auth-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install kiteconnect python-dotenv structlog pydantic-settings pyyaml

      - name: Check Session Validity
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          PYTHONPATH: .
        run: |
          # Validate required environment variables
          if [ -z "$KITE_API_KEY" ] || [ -z "$KITE_API_SECRET" ]; then
            echo "Error: KITE_API_KEY or KITE_API_SECRET is not set"
            exit 1
          fi
          
          if [ -z "$KITE_ACCESS_TOKEN" ]; then
            echo "Warning: KITE_ACCESS_TOKEN is not set"
            exit 1
          fi
          
          # Check session using the core auth module
          python -c "from packages.core.auth.kite_auth import KiteAuth; import sys; sys.exit(0 if KiteAuth().is_session_valid() else 1)"
        continue-on-error: true
        id: check_session

      - name: Create Issue if Auth Required
        if: steps.check_session.outcome == 'failure'
        uses: actions/github-script@v6
        with:
          script: |
            const loginUrl = `https://kite.trade/connect/login?api_key=${process.env.KITE_API_KEY}&v=3`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔐 Action Required: Renew Kite Access Token',
              body: `The daily auth check failed at 8:00 AM IST.

              **Steps to Renew:**
              1. Run \`python scripts/kite_auth_bootstrap.py\` on your local machine or server.
              2. Follow the prompt to login securely.
              3. The token will be refreshed in your environment.

              [Click here to Login to Kite](${loginUrl}) (Only for manual flow reference)`
            });
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
