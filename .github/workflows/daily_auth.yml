name: Daily Kite Auth Check

on:
  schedule:
    - cron: '30 2 * * *' # 08:00 AM IST (02:30 UTC)
  workflow_dispatch:

jobs:
  check-auth:
    name: Check Kite Connect Session
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Check Session Validity
        id: check
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          TRADING_MODE: PAPER
        run: |
          # Capture output to file for issue body
          python scripts/kite_auth_bootstrap.py --check-only > auth_output.txt 2>&1
        continue-on-error: true

      - name: Create Issue on Auth Failure
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let logOutput = '';
            try {
              logOutput = fs.readFileSync('auth_output.txt', 'utf8');
            } catch (e) {
              logOutput = 'Could not read log output.';
            }

            const issueBody = `
            ### ⚠️ Kite Auth Token Expired or Invalid

            The daily auth check failed. Please perform the manual login flow immediately.

            **Instructions:**
            1. SSH into the trading server (VPS).
            2. Run: \`python scripts/kite_auth_bootstrap.py\`
            3. Follow the login URL instructions.

            **Log Output:**
            \`\`\`
            ${logOutput}
            \`\`\`
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Action Required: Renew Kite Connect Token',
              body: issueBody,
              labels: ['urgent', 'auth']
            });

            // Fail the workflow to alert via email/status
            core.setFailed('Auth check failed. Issue created.');
