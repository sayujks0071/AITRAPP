name: Nightly Backtests

on:
  schedule:
    # 18:00 UTC ≈ 23:30 IST – adjust as you like
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full backtests
        run: |
          mkdir -p reports/backtests
          TO_DATE=$(date -u +"%Y-%m-%d")
          
          echo "🚀 Running full backtest suite..."
          echo "Date: $TO_DATE"
          
          # Run NIFTY backtest
          python scripts/run_backtest.py \
            --symbol NIFTY \
            --start-date 2025-08-15 \
            --end-date "$TO_DATE" \
            --strategy all \
            --capital 1000000 \
            --data-dir "docs/NSE OPINONS DATA" > "reports/backtests/nifty_${TO_DATE}.txt" 2>&1 || echo "⚠️ NIFTY backtest failed"
          
          # Run BANKNIFTY backtest
          python scripts/run_backtest.py \
            --symbol BANKNIFTY \
            --start-date 2025-08-15 \
            --end-date "$TO_DATE" \
            --strategy all \
            --capital 1000000 \
            --data-dir "docs/NSE OPINONS DATA" > "reports/backtests/banknifty_${TO_DATE}.txt" 2>&1 || echo "⚠️ BANKNIFTY backtest failed"
          
          echo "✅ Backtests completed"

      - name: Summarise backtests as Markdown
        run: |
          TO_DATE=$(date -u +"%Y-%m-%d")
          mkdir -p reports/backtests
          
          # Generate summary markdown
          python scripts/summarise_backtests.py \
            --date "$TO_DATE" \
            --out "reports/backtests/${TO_DATE}_summary.md" || echo "⚠️ Summary generation failed (script may need implementation)"

      - name: Upload backtest reports
        uses: actions/upload-artifact@v4
        with:
          name: nightly-backtests-${{ github.run_number }}
          path: reports/backtests/
          retention-days: 30
