name: Strategy Foundry Hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/strategy_foundry/**'

jobs:
  run-strategy-lab:
    runs-on: ubuntu-latest
    env:
      FAST_MODE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy requests structlog pytz

      - name: Run Strategy Foundry
        run: python -m packages.strategy_foundry.run_hourly

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-foundry-results
          path: packages/strategy_foundry/results/
          retention-days: 7
