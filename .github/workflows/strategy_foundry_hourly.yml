name: Strategy Foundry Hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/strategy_foundry/**'

jobs:
  hourly_run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas numpy requests pyyaml structlog pydantic pytz

      - name: Run Foundry (Fast Mode for PR)
        env:
          FAST_MODE: ${{ github.event_name == 'pull_request' && '1' or '0' }}
          PYTHONPATH: .
        run: python -m packages.strategy_foundry.run_hourly

      - name: Archive Results
        uses: actions/upload-artifact@v3
        with:
          name: foundry-results
          path: packages/strategy_foundry/results/
          retention-days: 7
