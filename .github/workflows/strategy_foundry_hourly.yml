name: Strategy Foundry Hourly

on:
  schedule:
    - cron: "0 * * * *"  # Run every hour
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/strategy_foundry/**"

jobs:
  foundry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install pandas numpy requests structlog pyyaml pytz pydantic pydantic-settings sqlalchemy

      - name: Run Foundry (Hourly)
        env:
          FAST_MODE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          PYTHONPATH: .
        run: |
          python -m packages.strategy_foundry.run_hourly

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foundry-results
          path: packages/strategy_foundry/results/
          retention-days: 7

      - name: Commit Leaderboard
        if: env.COMMIT_RESULTS == 'true'
        run: |
          git config --global user.name "StrategyFoundry Bot"
          git config --global user.email "bot@strategyfoundry.internal"
          git add packages/strategy_foundry/results/leaderboard_*.md
          git commit -m "Update Strategy Foundry Leaderboard [skip ci]" || echo "No changes to commit"
          git push
