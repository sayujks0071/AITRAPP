name: Strategy Foundry Hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  pull_request:

jobs:
  run-foundry:
    runs-on: ubuntu-latest
    env:
      FAST_MODE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install pandas pyyaml numpy requests tabulate

      - name: Run Strategy Foundry
        run: |
          python packages/strategy_foundry/run_hourly.py

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-results
          path: packages/strategy_foundry/results/

      - name: Commit Leaderboard
        if: github.event_name != 'pull_request' && env.COMMIT_RESULTS == 'true'
        run: |
          git config --global user.name "StrategyFoundry Bot"
          git config --global user.email "bot@strategyfoundry.internal"
          git add packages/strategy_foundry/results/leaderboard.md
          git commit -m "Update leaderboard [skip ci]" || echo "No changes to commit"
          git push
