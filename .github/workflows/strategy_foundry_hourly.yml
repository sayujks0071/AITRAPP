name: Strategy Foundry Hourly
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/strategy_foundry/**"

jobs:
  run-foundry:
    runs-on: ubuntu-latest
    env:
      FAST_MODE: ${{ github.event_name == 'pull_request' && '1' || '0' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests

      - name: Run Strategy Foundry
        run: |
          export PYTHONPATH=.
          python -m packages.strategy_foundry.run_hourly

      - name: Archive Results
        uses: actions/upload-artifact@v4
        with:
          name: foundry-results
          path: packages/strategy_foundry/results/
