name: Strategy Foundry Hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/strategy_foundry/**'

jobs:
  run-foundry:
    runs-on: ubuntu-latest
    env:
      FAST_MODE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas requests structlog
          # Install core requirements if needed, but we try to be minimal
          # pip install -r requirements.txt

      - name: Run Foundry
        run: python packages/strategy_foundry/run_hourly.py

      - name: Upload Results
        uses: actions/upload-artifact@v3
        with:
          name: foundry-results
          path: packages/strategy_foundry/results/
          retention-days: 7

      - name: Commit Leaderboard (Optional)
        if: github.event_name == 'schedule' && env.COMMIT_RESULTS == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add packages/strategy_foundry/results/leaderboard.md
          git commit -m "Update Leaderboard [skip ci]" || echo "No changes to commit"
          git push
