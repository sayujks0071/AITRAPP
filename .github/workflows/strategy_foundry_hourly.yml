name: Aggressive Intraday Foundry

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/strategy_foundry/**"

jobs:
  run-foundry:
    runs-on: ubuntu-latest
    env:
      FAST_MODE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install pandas numpy requests structlog pyyaml tabulate pydantic pydantic-settings
      - name: Run Foundry
        run: python -m packages.strategy_foundry.run_hourly
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: foundry-results
          path: packages/strategy_foundry/results/
