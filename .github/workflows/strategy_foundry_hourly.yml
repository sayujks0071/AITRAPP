name: Strategy Foundry Hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/strategy_foundry/**'

jobs:
  run-foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas numpy requests structlog pyyaml
          # Install core if needed or minimal reqs
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Strategy Foundry
        env:
          FAST_MODE: ${{ github.event_name == 'pull_request' && '1' or '0' }}
          PYTHONPATH: .
        run: |
          python -m packages.strategy_foundry.run_hourly

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-results
          path: packages/strategy_foundry/results/
