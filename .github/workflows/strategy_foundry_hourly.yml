name: Strategy Foundry Hourly Run

on:
  schedule:
    - cron: "0 * * * *"  # Run hourly at minute 0
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/strategy_foundry/**"

env:
  PYTHONUNBUFFERED: "1"
  FAST_MODE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
  APP_MODE: "PAPER" # Ensure config loaded correctly

jobs:
  run-foundry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pandas numpy requests structlog pytz

      - name: Run Strategy Foundry
        run: |
          python -m packages.strategy_foundry.run_hourly

      - name: Upload Results Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: strategy-foundry-results
          path: packages/strategy_foundry/results/
          retention-days: 7

      - name: Commit Leaderboard (Optional)
        if: github.ref == 'refs/heads/main' && env.FAST_MODE == '0'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add packages/strategy_foundry/results/leaderboard.md
          git add packages/strategy_foundry/results/champions/current.json
          git commit -m "Update Strategy Foundry Leaderboard [skip ci]" || echo "No changes to commit"
          # push logic omitted for safety or use a PAT if configured
          # git push
