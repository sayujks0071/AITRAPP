name: Strategy Foundry Hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/strategy_foundry/**'

jobs:
  run-foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas numpy httpx structlog pytz

      - name: Run Hourly (Fast Mode for PR)
        env:
          FAST_MODE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          PYTHONPATH: .
        run: |
          python -m packages.strategy_foundry.run_hourly

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-results
          path: packages/strategy_foundry/results/
