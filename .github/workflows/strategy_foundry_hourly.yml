name: Strategy Foundry Hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pandas numpy pytz structlog requests pyyaml pydantic pydantic-settings

      - name: Run Hourly Pipeline
        env:
          FAST_MODE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          PYTHONPATH: .
        run: python -m packages.strategy_foundry.run_hourly

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: foundry-results
          path: packages/strategy_foundry/results/
