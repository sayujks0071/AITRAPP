name: Strategy Foundry Hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/strategy_foundry/**"

jobs:
  foundry-run:
    runs-on: ubuntu-latest
    env:
      FAST_MODE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install pandas numpy httpx structlog pydantic pytz
          # No heavy deps

      - name: Run Strategy Foundry
        run: python packages/strategy_foundry/run_hourly.py

      - name: Archive Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: foundry-results
          path: packages/strategy_foundry/results/
          retention-days: 7
