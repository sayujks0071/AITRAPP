name: Strategy Foundry Hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/strategy_foundry/**"

jobs:
  run-foundry:
    runs-on: ubuntu-latest
    env:
      FAST_MODE: ${{ github.event_name == 'pull_request' && '1' or '0' }}
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install pandas numpy structlog pyyaml requests tabulate pytz
          # Install core deps if needed, or minimal set
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Strategy Foundry
        run: |
          python packages/strategy_foundry/run_hourly.py

      - name: Upload Results
        uses: actions/upload-artifact@v3
        with:
          name: foundry-results
          path: packages/strategy_foundry/results/
          retention-days: 7
