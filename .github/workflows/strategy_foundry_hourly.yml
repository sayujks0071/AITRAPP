name: Strategy Foundry Hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/strategy_foundry/**'

jobs:
  run-foundry:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # If needed, install strategy_foundry deps specifically if not in root reqs
        # But they should be standard (pandas, numpy, httpx).

    - name: Run Foundry
      env:
        FAST_MODE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        PYTHONPATH: .
      run: |
        python packages/strategy_foundry/run_hourly.py

    - name: Archive Results
      uses: actions/upload-artifact@v3
      with:
        name: foundry-results
        path: packages/strategy_foundry/results/
