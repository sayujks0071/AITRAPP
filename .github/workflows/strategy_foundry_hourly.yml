name: Strategy Foundry Hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:

jobs:
  run-foundry:
    runs-on: ubuntu-latest
    env:
      FAST_MODE: "1"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install pandas numpy requests structlog pyyaml

      - name: Run Hourly Process
        run: python -m packages.strategy_foundry.run_hourly

      - name: Archive Results
        uses: actions/upload-artifact@v3
        with:
          name: foundry-results
          path: packages/strategy_foundry/results/
