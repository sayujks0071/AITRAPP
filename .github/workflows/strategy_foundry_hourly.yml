name: Strategy Foundry Hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/strategy_foundry/**'

jobs:
  run-foundry:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy requests structlog tabulate pytz

      - name: Run Foundry
        env:
          FAST_MODE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: python packages/strategy_foundry/run_hourly.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: strategy-foundry-results
          path: packages/strategy_foundry/results/
