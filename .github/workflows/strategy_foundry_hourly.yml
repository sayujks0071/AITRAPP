name: Strategy Foundry Hourly

on:
  schedule:
    - cron: '0 * * * *' # Hourly
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/strategy_foundry/**'

jobs:
  run-foundry:
    runs-on: ubuntu-latest
    env:
      FAST_MODE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      PYTHONPATH: .

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt || true
        pip install pandas numpy requests pyyaml structlog pytz

    - name: Run Foundry
      run: python -m packages.strategy_foundry.run_hourly

    - name: Upload Results
      uses: actions/upload-artifact@v3
      with:
        name: foundry-results
        path: packages/strategy_foundry/results/
        retention-days: 7

    - name: Commit Leaderboard (Optional)
      if: github.event_name != 'pull_request' && env.COMMIT_RESULTS == 'true'
      run: |
        git config --global user.name 'Foundry Bot'
        git config --global user.email 'foundry@bot'
        git add packages/strategy_foundry/results/leaderboard_*.md
        git commit -m "Update Foundry Leaderboard" || echo "No changes to commit"
        git push
