name: Weekly AI Trading Review

on:
  schedule:
    # Every Monday 03:00 UTC ≈ 08:30 IST
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # write permission needed if auto-committing reviews
  # contents: write

jobs:
  weekly-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0  # Full history for weekly analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install AI dependencies if not already in requirements.txt
          pip install openai google-generativeai || echo "AI packages already installed"

      - name: Download recent backtest artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-backtests-*
          merge-multiple: true
          path: reports/backtests/
        continue-on-error: true  # Don't fail if no artifacts exist

      - name: Generate weekly AI review
        run: |
          mkdir -p docs/weekly-reviews
          
          # Generate review using OpenAI or Gemini
          python scripts/ai_weekly_review.py \
            --output "docs/weekly-reviews/$(date -u +%Y-W%V).md" \
            --backtest-dir "reports/backtests" \
            --lookback-days 7 || echo "⚠️ AI review generation failed (script may need implementation)"

      - name: Upload weekly review as artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-ai-review-${{ github.run_number }}
          path: docs/weekly-reviews/
          retention-days: 90

      # OPTIONAL: Auto-commit the review back into repo
      # Uncomment if you want reviews committed automatically
      # - name: Commit weekly review
      #   if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git add docs/weekly-reviews/
      #     git diff --staged --quiet || (git commit -m "chore: add weekly AI trading review [skip ci]" && git push) || echo "No changes to commit"

