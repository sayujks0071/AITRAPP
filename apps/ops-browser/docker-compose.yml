version: '3.9'

services:
  ops-browser:
    build:
      context: ../..
      dockerfile: apps/ops-browser/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3











