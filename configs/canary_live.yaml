# Canary LIVE profile for Monday 09:30-11:00 IST (conservative)
# Use this override for the first LIVE canary window
# After 2-3 clean sessions, switch to configs/live.yaml with raised caps

mode: LIVE

risk:
  per_trade_risk_pct: 0.30       # Conservative: 0.30% per trade
  max_portfolio_heat_pct: 1.0    # Conservative: 1.0% portfolio heat
  daily_loss_stop_pct: 1.50      # Conservative: -1.50% daily stop
  max_open_positions: 2          # Conservative: 2 concurrent positions

execution:
  default_order_type: LIMIT
  limit_chase_ticks: 2
  limit_timeout_sec: 5
  ioc_for_exits: true
  max_order_retries: 3
  retry_backoff_ms: 500
  tops_cap_per_sec: 5
  price_band_bps: 30             # Conservative: 30 bps price band
  min_order_interval_ms: 350     # Conservative: 350ms engine gaps
  per_instrument_cooldown_ms: 350 # Conservative: 350ms per-instrument cooldown
  order_burst_limit: 4           # Conservative: burst limit 4
  order_burst_cooldown_ms: 1000
  order_fanout_per_sec: 6        # Conservative: fan-out 6/s
  ioc_retry_attempts: 2

universe:
  # Canary underlyings for Monday 09:30-11:00 IST
  indices: 
    - NIFTY
    - BANKNIFTY
  fo_stocks_liquidity_rank_top_n: 0   # indices only for canary window

exits:
  trail_atr_mult: 1.0
  time_stop_min: 15
  tp1_rr: 1.0
  tp2_rr: 1.8

guards:
  block_around_events_min: 10   # CPI/RBI/expiry
  max_spread_mid_pct: 0.35
