sebi_bps: 0.0005

# Total round-trip cost (approximate)
# For a ₹100,000 trade:
# - Slippage: 5 bps = ₹50
# - Brokerage: ₹20
# - Exchange: 3 bps = ₹30
# - STT: 1 bps = ₹10
# - GST: 1.8 bps = ₹18
# - Stamp: 0.003 bps = ₹0.30
