app:
  mode: CRYPTO_LIVE
  timezone: UTC

venue:
  name: BINANCE_SPOT
  base_asset: USDT
  allowed_symbols: [BTCUSDT, ETHUSDT]  # Limited to 2 symbols for canary
  maker_fee_bps: 10
  taker_fee_bps: 10  # Binance: 0.1% = 10 bps (VIP 0)
  ws_reconnect_secs: 3
  rest_rps: 8
  
  # Per-symbol slippage/fee overrides (optional)
  symbol_configs:
    BTCUSDT:
      slippage_bps: 5
      maker_fee_bps: 10
      taker_fee_bps: 10
    ETHUSDT:
      slippage_bps: 5
      maker_fee_bps: 10
      taker_fee_bps: 10

risk:
  per_trade_risk_pct: 0.15  # Tighter: 0.15% (was 0.25% in PAPER)
  portfolio_heat_pct: 0.5   # Tighter: 0.5% (was 1.0% in PAPER)
  daily_stop_pct: -0.75     # Tighter: -0.75% (was -1.25% in PAPER)
  max_positions: 1          # Tighter: 1 position max (was 2 in PAPER)
  min_notional_usd: 25

execution:
  engine_gap_ms: 350
  instrument_gap_ms: 350
  price_band_bps: 40
  burst: 2                  # Tighter: 2 orders (was 4 in PAPER)
  fanout_per_sec: 4         # Tighter: 4/s (was 6/s in PAPER)
  use_native_oco: true  # Binance supports native OCO

secrets_env:
  api_key: BINANCE_API_KEY
  api_secret: BINANCE_API_SECRET

# Strategy Configuration (single strategy for canary)
strategies:
  - name: ORB
    enabled: true
    priority: 1
    params:
      window_min: 15
      breakout_confirmation_ticks: 3
      rr_min: 1.8
      max_positions: 1
      instruments: [BTCUSDT]  # Single symbol for canary

# Ranking Engine Configuration
ranking:
  weights:
    momentum: 0.25
    trend: 0.25
    liquidity: 0.20
    regime: 0.15
    rr: 0.15
  
  penalties:
    illiquid_mult: 0.5
    news_event_mult: 0.7
    far_from_vwap_mult: 0.8
  
  top_n: 3  # Reduced from 5

# Exit Management
exits:
  hard_stop_atr_mult: 2.0
  trail_enabled: true
  trail_atr_mult: 1.2
  trail_step_pct: 0.5
  tp1_rr: 1.2
  tp1_partial_pct: 50
  tp2_rr: 2.0
  tp2_partial_pct: 100
  move_to_be_after_tp1: true
  time_stop_enabled: true
  time_stop_min: 20
  vol_stop_enabled: true
  vol_spike_mult: 2.0
  mae_stop_enabled: true
  mae_stop_pct: 1.5

# Market Hours (24/7 for crypto)
market:
  open_time: "00:00"
  close_time: "23:59"
  eod_squareoff_time: "23:59"
  eod_squareoff_enabled: false
  premarket_sync_time: "00:00"
  event_aware: false
  event_stop_mult: 1.5

# Order Execution
execution:
  default_order_type: LIMIT
  limit_chase_ticks: 2
  limit_timeout_sec: 5
  ioc_for_exits: true
  max_order_retries: 3
  retry_backoff_ms: 500
  dry_run: false

# WebSocket Configuration
websocket:
  tick_interval_ms: 1000
  aggregation_windows: [1, 5]
  reconnect_delay_sec: 3
  max_reconnect_attempts: 10
  subscribe_mode: FULL

# Logging & Audit
logging:
  level: INFO
  format: json
  log_file: logs/aitrapp_crypto_live.log
  max_bytes: 104857600
  backup_count: 10
  audit_all_decisions: true
  audit_retention_days: 90

# Monitoring
monitoring:
  prometheus_enabled: true
  prometheus_port: 9090
  health_check_interval_sec: 30

