version: "3.9"

services:
  postgres:
    # Pin postgres:16 to specific digest for reproducibility
    # Update digest using: docker pull postgres:16 && docker inspect --format='{{index .RepoDigests 0}}' postgres:16
    image: postgres:16@sha256:e5507c984377515b8c9922b0eb19f55aba2063fdc7bccf268cefd53133f97054
    environment:
      POSTGRES_PASSWORD: trader
      POSTGRES_USER: trader
      POSTGRES_DB: aitrapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Pin redis:7 to specific digest for reproducibility
    # Update digest using: docker pull redis:7 && docker inspect --format='{{index .RepoDigests 0}}' redis:7
    image: redis:7@sha256:6cbef353e34940c6e0389c9d75957071c5fa0c2271f1bf9617e598dbba0b7d82
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./configs:/app/configs

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web

volumes:
  pgdata:
