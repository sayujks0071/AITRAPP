/opt/aitrapp/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    # Optional: ship compressed archives to S3 for long-term retention
    # postrotate
    #   find /opt/aitrapp/logs -name '*.gz' -mtime +1 -print0 | xargs -0 -I{} aws s3 cp {} s3://your-compliance-bucket/logs/
    # endscript
}
