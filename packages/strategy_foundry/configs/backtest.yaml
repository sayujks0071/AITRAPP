# Strategy Foundry Backtest Configuration

data:
  cache_dir: "packages/strategy_foundry/data/cache"
  history_days: 2520 # 10 years roughly
  symbols:
    - "^NSEI"   # NIFTY 50
    - "^BSESN"  # SENSEX

costs:
  # All-in costs in basis points (bps) per round trip
  # Includes brokerage, STT, exchange trans charges, stamp duty, GST
  default_bps: 5.0
  slippage_bps: 2.0

backtest:
  initial_capital: 1000000
  start_date: "2018-01-01"
  # walk_forward_folds: 5 # defined in code logic, but can be here too

constraints:
  max_drawdown_pct: 35.0
  min_trades: 30
  min_oos_sharpe: 0.5

execution:
  mode: "NEXT_OPEN" # Execute on next bar's open

generation:
  candidates_per_hour: 50
  max_parameters: 10

selection:
  promotion_margin_pct: 10.0
