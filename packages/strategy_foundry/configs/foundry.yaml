# Core Intraday Lab Settings
# These defaults drive the factory and backtest engine.

timeframes:
  - "5m"
  - "15m"

generation:
  candidates_per_run_full: 80
  candidates_per_run_fast: 15
  folds_full: 4
  folds_fast: 2

costs:
  bps_per_side: 5.0
  slippage_bps: 5.0

gate:
  min_oos_sharpe: 1.2
  max_dd_pct: 20
  min_positive_folds: 3
