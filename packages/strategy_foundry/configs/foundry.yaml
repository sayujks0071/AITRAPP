# Default parameters for Strategy Foundry

generation:
  candidates_per_run: 80
  fast_mode_candidates: 15
  intraday_timeframes: ["5m", "15m"]
  sanity_timeframe: "1D"

backtest:
  cost_bps: 2.0         # 0.02% per side (approx futures/ETF)
  slippage_bps: 3.0     # 0.03% per side estimate
  spread_guard_bps: 2.0 # Extra penalty for liquidity
  initial_capital: 100000

evaluation:
  folds: 4
  fast_mode_folds: 2
  min_trades_5m: 80
  min_trades_15m: 40
  max_dd_pct: 30.0
  min_profit_factor: 1.1

promotion:
  min_sharpe: 1.2
  min_improvement_pct: 10.0
  max_dd_live: 20.0
  min_positive_folds: 3

execution:
  session_end_time: "15:25"
  max_holding_time_minutes: 370 # 6 hours 10 mins (approx full session)
