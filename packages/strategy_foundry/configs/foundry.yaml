# Aggressive Intraday StrategyFoundry Configuration

generation:
  candidates_per_run: 80
  candidates_per_run_fast: 15
  timeframes: ["5m", "15m"]
  sanity_timeframe: "1d"

backtest:
  costs:
    all_in_cost_bps_per_side: 3.0  # Brokerage + Taxes approx
    slippage_bps_per_side: 2.0     # Execution slip
    spread_guard_bps: 1.0          # Extra guard for liquidity

  risk:
    default_sizing_type: "fixed_fraction"
    default_sizing_fraction: 1.0   # 100% of capital

  validation:
    min_trades_5m: 80
    min_trades_15m: 40
    max_drawdown_pct: 30.0
    min_profit_factor: 1.1
    min_positive_folds_ratio: 0.75 # 3 out of 4

ranking:
  weights:
    sharpe: 0.25
    calmar: 0.25
    cagr: 0.20
    stability: 0.15
    turnover: 0.10
    sanity: 0.05

promotion:
  min_sharpe_to_live: 1.2
  max_dd_to_live: 20.0
  challenger_improvement_pct: 10.0 # Must be 10% better than champion
