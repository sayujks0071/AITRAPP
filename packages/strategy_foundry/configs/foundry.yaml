# Foundry Configuration

defaults:
  timeframes: ["5m", "15m"]
  sanity_timeframe: "1D"

  # Generation defaults
  candidates_per_run: 80
  fast_mode_candidates: 15

  # Backtest defaults
  oos_folds: 4
  fast_mode_folds: 2

  # Cost defaults (conservative)
  costs:
    equity_intraday:
      slippage_bps: 3
      brokerage_flat: 20
      tax_bps: 3

  # Risk management
  risk:
    max_drawdown_limit: 30.0  # %
    min_trades_oos: 10
    profit_factor_min: 1.1

  # Market Hours (IST)
  market_open: "09:15"
  market_close: "15:30"
  intraday_square_off: "15:25"

logging:
  level: "INFO"
